name: Sestavit Android APK

on:
push:
branches: [ "main", "master" ]
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Stažení repozitáře
    uses: actions/checkout@v4

  - name: Nastavení JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'

  - name: Nastavení Android SDK
    uses: android-actions/setup-android@v3

  - name: Instalace Gradle 8.9
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Sestavení Debug APK
    run: gradle assembleDebug

  - name: Nahrání hotového APK ke stažení
    uses: actions/upload-artifact@v4
    with:
      name: MojeKamery-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
