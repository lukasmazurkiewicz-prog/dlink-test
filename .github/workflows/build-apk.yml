name: Sestavit Android APK

on:


push:




branches:






- main
- master
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Stazeni repozitare
uses: actions/checkout@v4

  - name: Nastaveni JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'

  - name: Nastaveni Android SDK
    uses: android-actions/setup-android@v3

  - name: Instalace Gradle 8.9
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Sestaveni Debug APK
    run: gradle assembleDebug

  - name: Nahrani hotoveho APK ke stazeni
    uses: actions/upload-artifact@v4
    with:
      name: MojeKamery-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
